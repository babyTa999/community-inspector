services:
  discord-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./bot.py:/app/bot.py
      - ./classifier.py:/app/classifier.py
      - ./dedup.py:/app/dedup.py
      - ./formatter.py:/app/formatter.py
      - ./scheduler.py:/app/scheduler.py
    restart: always
